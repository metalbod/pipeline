name: dbt CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  dbt-build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -e .

      - name: dbt deps
        working-directory: dbt_project
        run: dbt deps

      - name: dbt build && dbt test
        working-directory: dbt_project
        env:
          DUCKDB_PATH: ../storage/warehouse.duckdb
        run: |
          mkdir -p ../storage
          dbt build
          dbt test

name: dbt CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  dbt-build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -e .

      - name: dbt deps
        working-directory: dbt_project
        run: dbt deps

      - name: Seed Bronze demo data
        run: |
          mkdir -p storage
          python scripts/seed_demo_data.py

      - name: dbt build && dbt test
        working-directory: dbt_project
        env:
          DUCKDB_PATH: ../storage/warehouse.duckdb
        run: |
          dbt build
          dbt test

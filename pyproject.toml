[project]
name = "finance-platform"
version = "0.1.0"
requires-python = ">=3.11,<3.13"
dependencies = [
    "dagster>=1.8",
    "dagster-webserver>=1.8",
    "dagster-dbt>=0.24",
    "dbt-core>=1.8",
    "dbt-duckdb>=1.8",
    "duckdb>=1.0",
    "fsspec>=2024.6",
    "python-dotenv>=1.0",
    "pytest>=8.0",
    "deltalake>=0.20",
    "pyarrow>=16.0",
    "polars>=1.0",
    "pandera>=0.20",
    "httpx>=0.27",
    "respx>=0.21",
    "streamlit>=1.38",
    "openpyxl>=3.1",
    "xlsxwriter>=3.2",
    "fastexcel>=0.11",
    "filelock>=3.13",
    "openmetadata-ingestion[dbt]>=1.12,<1.13",
    "cachetools>=5.0",  # transitive dep openmetadata-ingestion needs but doesn't declare
]

[tool.dagster]
module_name = "dagster_project.definitions"

[tool.setuptools.packages.find]
include = ["dagster_project*", "ingestion*", "data_quality*"]

[project]
name = "finance-platform"
version = "0.1.0"
requires-python = ">=3.11,<3.13"
dependencies = [
    "dagster>=1.8",
    "dagster-webserver>=1.8",
    "dagster-dbt>=0.24",
    "dbt-core>=1.8",
    "dbt-duckdb>=1.8",
    "duckdb>=1.0",
    "fsspec>=2024.6",
    "python-dotenv>=1.0",
    "pytest>=8.0",
]

[tool.dagster]
module_name = "dagster_project.definitions"

[tool.setuptools.packages.find]
include = ["dagster_project*", "ingestion*"]

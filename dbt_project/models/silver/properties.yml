version: 2

models:
  - name: dim_entity
    description: Entity master (Silver). Passthrough of seed_dim_entity.
    columns:
      - name: entity_id
        data_tests:
          - not_null
          - unique
      - name: functional_currency
        data_tests:
          - not_null

  - name: dim_account_group_standard
    description: >
      Group-standard chart of accounts (Silver), with a surrogate account_key for SCD Type 2
      history. Owned by group finance, not derived automatically (ARCHITECTURE.md §6.1) --
      populated via the coa-mapper proposal + human-approval workflow.
    columns:
      - name: account_key
        data_tests:
          - not_null
          - unique
      - name: group_standard_code
        data_tests:
          - unique

  - name: coa_mapping
    description: >
      Effective-dated entity-to-group-standard COA mapping (Silver). Unmapped local accounts
      must fail loudly (see tests/assert_no_dropped_journal_lines.sql), never be silently dropped
      (ARCHITECTURE.md §6.1).
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - entity_id
              - local_account_code
              - effective_from

  - name: stg_journal_lines
    description: >
      Deduped Bronze journal lines (Silver staging) -- converged from both the Xero and file
      connectors (ARCHITECTURE.md §5). Row identity is (source_system, entity_id, journal_id,
      line_no); source_updated_at breaks ties in favor of the latest version.
    columns:
      - name: entity_id
        data_tests:
          - not_null
      - name: journal_id
        data_tests:
          - not_null
      - name: debit_amount
        data_tests:
          - not_null
      - name: credit_amount
        data_tests:
          - not_null

  - name: dim_period
    description: Generated monthly calendar dimension (2015-2035), via dbt_utils.date_spine.
    columns:
      - name: period_key
        data_tests:
          - not_null
          - unique
      - name: fiscal_year
        data_tests:
          - not_null
      - name: fiscal_period
        data_tests:
          - not_null

  - name: dim_fx_rate
    description: >
      Governed FX rate table (Silver) -- period-end and period-average rates to the group
      reporting currency (MYR), per ARCHITECTURE.md §6.3. SGD rates are clearly-labeled
      placeholders pending a real Finance-provided rate; swap the seed value, no code changes.
    columns:
      - name: currency_code
        data_tests:
          - not_null
      - name: rate_to_group_currency
        data_tests:
          - not_null
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - currency_code
              - fiscal_year
              - fiscal_period
              - rate_type

  - name: fct_journal_line
    description: >
      Atomic, auditable fact grain (ARCHITECTURE.md §6.2) -- every consolidated number traces
      back to a SUM() over rows here. group_currency_amount/fx_rate_used are FX-translated via
      dim_fx_rate (current-rate method); is_intercompany/counterparty_entity_id come from
      intercompany_accounts.
    columns:
      - name: journal_line_key
        data_tests:
          - not_null
          - unique
      - name: entity_id
        data_tests:
          - not_null
      - name: account_key
        data_tests:
          - not_null
      - name: period_key
        data_tests:
          - not_null
      - name: group_currency_amount
        data_tests:
          - not_null
      - name: fx_rate_used
        data_tests:
          - not_null

  - name: intercompany_accounts
    description: >
      Governed designation of which local accounts represent intercompany balances, and with
      which counterparty entity (ARCHITECTURE.md §6.2's counterparty_entity_id). Human-approved,
      same governance pattern as coa_mapping.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - entity_id
              - local_account_code
              - effective_from

  - name: elimination_rules
    description: >
      Governed gate on which (entity_id, counterparty_entity_id) pairs are approved for
      intercompany elimination (ARCHITECTURE.md §6.3 step 3). An intercompany balance with no
      matching rule here is not eliminated -- see fact_intercompany_elimination.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - entity_id
              - counterparty_entity_id
              - effective_from

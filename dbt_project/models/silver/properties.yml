version: 2

models:
  - name: stg_pipeline_snapshot
    description: >
      Finance-entered sales-pipeline estimate (Silver), not live CRM data -- see
      ingestion/file_connectors/pipeline_file_reader.py. Deduped on
      (source_system, entity_id, period, pipeline_stage).
    columns:
      - name: entity_id
        data_tests:
          - not_null
      - name: period_key
        data_tests:
          - not_null
      - name: pipeline_stage
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - Prospecting
                  - Qualification
                  - Proposal
                  - Negotiation
                  - ClosedWon

  - name: stg_ar_aging
    description: >
      Open AR invoices (Silver), converged from Xero's AgedReceivablesByContact report and
      SG-SUB's ar_aging file upload. days_overdue/aging_bucket recomputed fresh each run.
    columns:
      - name: entity_id
        data_tests:
          - not_null
      - name: source_record_id
        data_tests:
          - not_null
      - name: amount_outstanding
        data_tests:
          - not_null

  - name: stg_ap_aging
    description: >
      Open AP bills (Silver), converged from Xero's AgedPayablesByContact report and SG-SUB's
      ap_aging file upload. Same shape/logic as stg_ar_aging.
    columns:
      - name: entity_id
        data_tests:
          - not_null
      - name: amount_outstanding
        data_tests:
          - not_null

  - name: stg_budget
    description: >
      Budgeted amounts (Silver), converged from Xero's BudgetSummary report and SG-SUB's budget
      file upload, mapped through the existing coa_mapping table onto group_standard_code so
      rpt_budget_variance.sql can compare like-for-like against actuals.
    columns:
      - name: entity_id
        data_tests:
          - not_null
      - name: group_standard_code
        data_tests:
          - not_null
      - name: budgeted_amount
        data_tests:
          - not_null

  - name: debt_covenants
    description: >
      Governed debt-covenant terms (Finance-maintained), same pattern as
      intercompany_accounts.sql. Empty today -- no real debt facility exists yet; ready for
      Finance to populate once one does.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - entity_id
              - facility_name
              - effective_from

  - name: dim_entity
    description: Entity master (Silver). Passthrough of seed_dim_entity.
    columns:
      - name: entity_id
        data_tests:
          - not_null
          - unique
      - name: functional_currency
        data_tests:
          - not_null

  - name: dim_account_group_standard
    description: >
      Group-standard chart of accounts (Silver), with a surrogate account_key for SCD Type 2
      history. Owned by group finance, not derived automatically (ARCHITECTURE.md §6.1) --
      populated via the coa-mapper proposal + human-approval workflow.
    columns:
      - name: account_key
        data_tests:
          - not_null
          - unique
      - name: group_standard_code
        data_tests:
          - unique

  - name: coa_mapping
    description: >
      Effective-dated entity-to-group-standard COA mapping (Silver). Unmapped local accounts
      must fail loudly (see tests/assert_no_dropped_journal_lines.sql), never be silently dropped
      (ARCHITECTURE.md §6.1).
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - entity_id
              - local_account_code
              - effective_from

  - name: stg_journal_lines
    description: >
      Deduped Bronze journal lines (Silver staging) -- converged from both the Xero and file
      connectors (ARCHITECTURE.md §5). Row identity is (source_system, entity_id, journal_id,
      line_no); source_updated_at breaks ties in favor of the latest version.
    columns:
      - name: entity_id
        data_tests:
          - not_null
      - name: journal_id
        data_tests:
          - not_null
      - name: debit_amount
        data_tests:
          - not_null
      - name: credit_amount
        data_tests:
          - not_null

  - name: dim_period
    description: Generated monthly calendar dimension (2015-2035), via dbt_utils.date_spine.
    columns:
      - name: period_key
        data_tests:
          - not_null
          - unique
      - name: fiscal_year
        data_tests:
          - not_null
      - name: fiscal_period
        data_tests:
          - not_null

  - name: dim_fx_rate
    description: >
      Governed FX rate table (Silver) -- period-end and period-average rates to the group
      reporting currency (MYR), per ARCHITECTURE.md §6.3. SGD rates are clearly-labeled
      placeholders pending a real Finance-provided rate; swap the seed value, no code changes.
    columns:
      - name: currency_code
        data_tests:
          - not_null
      - name: rate_to_group_currency
        data_tests:
          - not_null
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - currency_code
              - fiscal_year
              - fiscal_period
              - rate_type

  - name: fct_journal_line
    description: >
      Atomic, auditable fact grain (ARCHITECTURE.md §6.2) -- every consolidated number traces
      back to a SUM() over rows here. group_currency_amount/fx_rate_used are FX-translated via
      dim_fx_rate (current-rate method); is_intercompany/counterparty_entity_id come from
      intercompany_accounts.
    columns:
      - name: journal_line_key
        data_tests:
          - not_null
          - unique
      - name: entity_id
        data_tests:
          - not_null
      - name: account_key
        data_tests:
          - not_null
      - name: period_key
        data_tests:
          - not_null
      - name: group_currency_amount
        data_tests:
          - not_null
      - name: fx_rate_used
        data_tests:
          - not_null

  - name: intercompany_accounts
    description: >
      Governed designation of which local accounts represent intercompany balances, and with
      which counterparty entity (ARCHITECTURE.md §6.2's counterparty_entity_id). Human-approved,
      same governance pattern as coa_mapping.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - entity_id
              - local_account_code
              - effective_from

  - name: elimination_rules
    description: >
      Governed gate on which (entity_id, counterparty_entity_id) pairs are approved for
      intercompany elimination (ARCHITECTURE.md §6.3 step 3). An intercompany balance with no
      matching rule here is not eliminated -- see fact_intercompany_elimination.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - entity_id
              - counterparty_entity_id
              - effective_from

  - name: user_entity_access
    description: >
      Governed user->entity access table (Phase 3 row-level security). Superset's RLS filter on
      the per-entity Gold datasets reads this table directly. GROUP_FINANCE_OWNER is unrestricted
      (blank entity_id); REGIONAL_CONTROLLER is scoped to exactly one entity_id.
    columns:
      - name: username
        data_tests:
          - not_null
      - name: role
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - GROUP_FINANCE_OWNER
                  - REGIONAL_CONTROLLER

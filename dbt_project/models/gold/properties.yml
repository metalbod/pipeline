version: 2

models:
  - name: rpt_gross_margin
    description: >
      (Revenue - COGS) / Revenue by entity/period. Reads 0% COGS / 100% margin until Finance
      posts to a COGS-classified account (GS-5100) in Xero or SG-SUB -- neither source has one
      today. Deliberately not wired into Superset yet (see ops/superset/build_cfo_dashboard.py
      header) -- a permanently-100% chart would be misleading.
    columns:
      - name: entity_id
        data_tests:
          - not_null
      - name: revenue
        data_tests:
          - not_null

  - name: rpt_covenant_headroom
    description: >
      Actual debt-to-equity ratio vs. seeded covenant threshold, headroom %, breach flag. Empty
      today -- debt_covenants (Silver) has zero rows until a real facility exists. Effective-dated
      against the covenant's [effective_from, effective_to) window so a future covenant can't
      retroactively flag past periods. Deliberately not wired into Superset yet, same reasoning
      as rpt_gross_margin.
    columns:
      - name: entity_id
        data_tests:
          - not_null
      - name: actual_debt_to_equity_ratio
        data_tests:
          - not_null

  - name: rpt_dso_dpo
    description: >
      Two figures side by side: dso_days_approx/dpo_days_approx (balance-based approximation,
      the original CFO-dashboard metric) and dso_days_true/dpo_days_true (invoice-weighted
      average days outstanding from stg_ar_aging/stg_ap_aging) -- both labeled so a reader isn't
      misled about which is which.
    columns:
      - name: entity_id
        data_tests:
          - not_null

  - name: rpt_top_overdue_receivables
    description: Open AR invoices past due, ranked by amount outstanding per entity.
    columns:
      - name: entity_id
        data_tests:
          - not_null
      - name: invoice_id
        data_tests:
          - not_null
      - name: days_overdue
        data_tests:
          - not_null

  - name: rpt_budget_variance
    description: >
      Budgeted vs. actual by entity/account/period. is_major_variance flags anything more than
      15% off budget -- a first-cut default threshold, not an established convention.
    columns:
      - name: entity_id
        data_tests:
          - not_null
      - name: group_standard_code
        data_tests:
          - not_null
      - name: budgeted_amount
        data_tests:
          - not_null

  - name: rpt_sales_pipeline_velocity
    description: >
      Finance-entered sales-pipeline estimate (Gold), not live CRM data -- see
      stg_pipeline_snapshot.sql. TCV/deal count by stage/period per entity, with a
      period-over-period TCV delta to surface slowdowns.
    columns:
      - name: entity_id
        data_tests:
          - not_null
      - name: pipeline_stage
        data_tests:
          - not_null
      - name: total_contract_value
        data_tests:
          - not_null

  - name: fct_balance
    description: >
      Derived entity/account/period balance summary (Gold) -- ARCHITECTURE.md §6.2. Computed
      for every account_type uniformly so the balance-sheet-equation test can use it directly.
      Grain includes counterparty_entity_id (null except for intercompany accounts) so
      fact_intercompany_elimination can select straight off this model. Forward-fills
      zero-movement periods (Phase 5) via a cross-join grid -- flagged in finance-reviewer pass
      as needing a grain uniqueness test given the added join complexity.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - entity_id
              - account_key
              - period_key
              - counterparty_entity_id
    columns:
      - name: entity_id
        data_tests:
          - not_null
      - name: account_key
        data_tests:
          - not_null
      - name: period_key
        data_tests:
          - not_null
      - name: closing_balance
        data_tests:
          - not_null
      - name: group_currency_amount
        data_tests:
          - not_null

  - name: fact_intercompany_elimination
    description: >
      Explicit intercompany elimination detail (ARCHITECTURE.md §6.2) -- what was eliminated and
      why, not netted away silently. Gated by elimination_rules (Silver); see
      tests/assert_intercompany_eliminations_net_to_zero.sql for the correctness check.
    columns:
      - name: entity_id
        data_tests:
          - not_null
      - name: counterparty_entity_id
        data_tests:
          - not_null
      - name: eliminated_amount
        data_tests:
          - not_null

  - name: rpt_balance_sheet
    description: >
      Unconsolidated balance sheet per entity/period -- what the Streamlit dashboard queries
      directly. Includes a computed "Current Period Earnings" row (unclosed revenue/expense
      folded into equity for display); see the model's header comment.

  - name: rpt_profit_and_loss
    description: Unconsolidated P&L per entity/period -- period_movement, not a cumulative balance.

  - name: fct_balance_consolidated
    description: >
      Group-level consolidated balances (ARCHITECTURE.md §6.3 steps 2-3) -- aggregated across
      entities, minus intercompany eliminations. Full consolidation method (100% of every
      entity's balance, regardless of ownership_pct). Exposes both consolidated_balance
      (cumulative, for balance-sheet accounts) and consolidated_period_movement (for P&L
      accounts).
    columns:
      - name: group_standard_code
        data_tests:
          - not_null
      - name: period_key
        data_tests:
          - not_null
      - name: consolidated_balance
        data_tests:
          - not_null

  - name: rpt_balance_sheet_consolidated
    description: >
      Consolidated balance sheet, group level. Equity is a two-line split -- "Equity Attributable
      to Parent" and "Non-Controlling Interest" -- computed from each subsidiary's ownership_pct;
      see the model's header comment for why it isn't itemized per equity account.

  - name: rpt_profit_and_loss_consolidated
    description: Consolidated P&L, group level -- consolidated_period_movement, not a cumulative balance.
